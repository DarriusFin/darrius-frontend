<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>DarriusAI Ranking Detail</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        Arial,
        sans-serif;
      background:
        #070b12;
      color:
        #eef3f8;
    }

    .page {
      width: min(
        1180px,
        calc(100% - 40px)
      );
      margin: 0 auto;
      padding:
        28px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content:
        space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      color: #8d99a8;
      font-size: 13px;
    }

    .backButton {
      border:
        1px solid #283240;
      border-radius: 9px;
      background: #111821;
      color: #dce5ef;
      padding: 10px 15px;
      cursor: pointer;
    }

    .backButton.activeTimeframe {
      border-color: #2be2a6;
      color: #2be2a6;
      background: rgba(43, 226, 166, 0.08);
    }

    .headerCard {
      border:
        1px solid #202b38;
      border-radius: 16px;
      background:
        #0d131c;
      padding: 22px;
      margin-bottom: 18px;
    }

    .symbolRow {
      display: flex;
      align-items: center;
      justify-content:
        space-between;
      gap: 20px;
    }

    .symbol {
      font-size: 34px;
      font-weight: 750;
      letter-spacing:
        0.02em;
    }

    .pill {
      display: inline-block;
      border:
        1px solid #283646;
      border-radius: 999px;
      background: #121a25;
      color: #aeb9c7;
      padding: 7px 12px;
      font-size: 12px;
    }

    .updated {
      margin-top: 12px;
      color: #778493;
      font-size: 12px;
    }

    .scoreGrid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .scoreCard {
      border:
        1px solid #202b38;
      border-radius: 14px;
      background:
        #0d131c;
      padding: 20px;
    }

    .label {
      color: #8492a3;
      font-size: 12px;
      text-transform:
        uppercase;
      letter-spacing:
        0.08em;
    }

    .bigValue {
      margin-top: 7px;
      font-size: 32px;
      font-weight: 750;
    }

    .section {
      border:
        1px solid #202b38;
      border-radius: 14px;
      background:
        #0d131c;
      padding: 20px;
      margin-bottom: 18px;
    }

    .sectionTitle {
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 700;
    }

    .components {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 12px;
    }

    .component {
      border:
        1px solid #202a36;
      border-radius: 11px;
      background:
        #101720;
      padding: 15px;
    }

    .componentName {
      color: #8c99a8;
      font-size: 12px;
    }

    .componentState {
      margin-top: 7px;
      font-size: 15px;
      font-weight: 650;
    }

    .stateBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 54px;
      height: 24px;
      padding: 0 9px;

      border-radius: 999px;
      border: 1px solid currentColor;

      font-size: 11px;
      font-weight: 700;
      line-height: 1;

      background: rgba(255, 255, 255, 0.025);
    }

    .signalB {
      color: #2be2a6;
    }

    .signalEB {
      color: #7ee8c4;
    }

    .signalES {
      color: #ffb86b;
    }

    .signalS {
      color: #ff6b7a;
    }

    .signalNeutral {
      color: #8492a3;
    }

    .mutantUp {
      color: #2be2a6;
    }

    .mutantDown {
      color: #ff6b7a;
    }

    .mutantNeutral {
      color: #8492a3;
    }

    .pulseBullish {
      color: #2be2a6;
    }

    .pulseBearish {
      color: #ff6b7a;
    }

    .pulseNeutral {
      color: #8492a3;
    }

    .summary {
      margin-bottom: 16px;
      line-height: 1.6;
      color: #dfe7ef;
    }

    .reason {
      border-top:
        1px solid #1c2631;
      padding:
        12px 0;
      color: #aeb9c6;
      line-height: 1.55;
      font-size: 14px;
    }

    .reason:first-child {
      border-top: 0;
    }

    .error {
      border:
        1px solid #543034;
      border-radius: 12px;
      background:
        #241417;
      color: #ffb4ba;
      padding: 18px;
    }

    @media (
      max-width: 800px
    ) {
      .components,
      .breakdownGrid {
        grid-template-columns:
          1fr;
      }

      .scoreGrid {
        grid-template-columns:
          1fr;
      }

      .symbolRow {
        align-items:
          flex-start;
        flex-direction:
          column;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="topbar">
      <div>
        <div class="brand">
          DarriusAI · Rank Engine
        </div>

        <div class="subtitle">
          Ranking Detail & Explainability
        </div>
      </div>

      <div
        style="
          display: flex;
          gap: 8px;
          align-items: center;
        "
      >
        <button
          class="backButton"
          id="tf1hBtn"
        >
          1H
        </button>

        <button
          class="backButton"
          id="tf1dBtn"
        >
          1D
        </button>

        <button
          class="backButton"
          onclick="history.back()"
        >
          Back to Ranking
        </button>
      </div>
    </div>

    <div id="content">
      Loading ranking detail...
    </div>

  </main>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const symbol =
      (
        params.get("symbol")
        || "PATH"
      ).toUpperCase();

    const timeframe =
      (
        params.get("timeframe")
        || "1h"
      ).toLowerCase();

    document
      .getElementById("tf1hBtn")
      .classList.toggle(
        "activeTimeframe",
        timeframe === "1h"
      );

    document
      .getElementById("tf1dBtn")
      .classList.toggle(
        "activeTimeframe",
        timeframe === "1d"
      );

    function switchTimeframe(
      nextTimeframe
    ) {
      const query =
        new URLSearchParams({
          symbol: symbol,
          timeframe: nextTimeframe
        });

      window.location.replace(
        `ranking_detail.html?${query.toString()}`
      );
    }


    document
      .getElementById("tf1hBtn")
      .addEventListener(
        "click",
        () => {
          switchTimeframe("1h");
        }
      );


    document
      .getElementById("tf1dBtn")
      .addEventListener(
        "click",
        () => {
          switchTimeframe("1d");
        }
      );

    const content =
      document.getElementById(
        "content"
      );


    function numberValue(
      value,
      digits = 2
    ) {
      const n =
        Number(value);

      if (!Number.isFinite(n)) {
        return "—";
      }

      return n.toFixed(
        digits
      );
    }


    async function loadDetail() {
      try {
        const response =
          await fetch(
            `https://darrius-api.onrender.com/api/ranking/detail`
            + `?symbol=${encodeURIComponent(symbol)}`
            + `&timeframe=${encodeURIComponent(timeframe)}`
          );

        const data =
          await response.json();

        if (
          !response.ok
          || !data.ok
        ) {
          throw new Error(
            data.message
            || "Failed to load ranking detail"
          );
        }

        const item =
          data.item || {};

        const explanation =
          data.explanation || {};

        const generatedAt =
          data.generated_at
            ? new Date(
                data.generated_at
              )
            : null;

        const formattedTime =
          generatedAt
          && !Number.isNaN(
            generatedAt.getTime()
          )
            ? new Intl.DateTimeFormat(
                undefined,
                {
                  year: "numeric",
                  month: "numeric",
                  day: "numeric",
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                  timeZoneName: "short",
                }
              ).format(
                generatedAt
              )
            : "Unavailable";

        const reasons =
          Array.isArray(
            explanation.reasons
          )
            ? explanation.reasons
            : [];

        content.innerHTML = `
          <section class="headerCard">

            <div class="symbolRow">
              <div class="symbol">
                ${item.symbol || symbol}
              </div>

              <div class="pill">
                ${
                  data.universe
                  || "US_CORE_500"
                }
                ·
                ${(
                  data.timeframe
                  || timeframe
                ).toUpperCase()}
              </div>
            </div>

            <div class="updated">
              Snapshot:
              ${formattedTime}
              · Rank #${item.rank ?? "—"}
            </div>

          </section>


          <div class="scoreGrid">

            <div class="scoreCard">
              <div class="label">
                Rank Score
              </div>

              <div class="bigValue">
                ${numberValue(
                  item.rank_score
                )}
              </div>
            </div>

            <div class="scoreCard">
              <div class="label">
                Confidence Score
              </div>

              <div class="bigValue">
                ${numberValue(
                  item.confidence
                )}
              </div>
            </div>

          </div>


          <section class="section">

            <div class="sectionTitle">
              Three Core Components
            </div>

            <div class="components">

              <div class="component">
                <div class="componentName">
                  Price Inflection
                </div>

                <div class="componentState">
                  <span class="stateBadge ${
                    item.signal === "B"
                      ? "signalB"
                      : item.signal === "eB"
                        ? "signalEB"
                        : item.signal === "eS"
                          ? "signalES"
                          : item.signal === "S"
                            ? "signalS"
                            : "signalNeutral"
                  }">
                    ${item.signal ?? "—"}
                  </span>
                </div>
              </div>


              <div class="component">
                <div class="componentName">
                  Darrius Mutant
                </div>

                <div class="componentState">
                  <span class="stateBadge ${
                    item.mutant_state === "UP"
                      ? "mutantUp"
                      : item.mutant_state === "DOWN"
                        ? "mutantDown"
                        : "mutantNeutral"
                  }">
                    ${item.mutant_state ?? "—"}
                  </span>
                </div>
              </div>


              <div class="component">
                <div class="componentName">
                  Market Pulse
                </div>

                <div class="componentState">
                  <span class="stateBadge ${
                    item.market_pulse_label === "Bullish"
                      ? "pulseBullish"
                      : item.market_pulse_label === "Bearish"
                        ? "pulseBearish"
                        : "pulseNeutral"
                  }">
                    ${item.market_pulse_label ?? "—"}
                  </span>
                </div>
              </div>

            </div>

          </section>

          <section class="section">

            <div class="sectionTitle">
              Why This Ranking?
            </div>

            <div class="summary">
              ${explanation.summary || ""}
            </div>

            <div>
              ${
                reasons
                  .map(
                    reason => `
                      <div class="reason">
                        ${reason}
                      </div>
                    `
                  )
                  .join("")
              }
            </div>

          </section>
        `;

      } catch (error) {

        content.innerHTML = `
          <div class="error">
            Ranking detail unavailable:
            ${error.message}
          </div>
        `;
      }
    }


    loadDetail();
  </script>

</body>
</html>
